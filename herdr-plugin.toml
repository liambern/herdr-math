id = "herdr-math"
name = "herdr-math"
version = "0.1.0"
min_herdr_version = "0.8.2"
description = "Typeset display equations in the current terminal pane"
platforms = ["linux", "macos"]

[[build]]
command = ["npm", "ci"]

[[actions]]
id = "toggle"
title = "Toggle equation rendering in this pane"
contexts = ["pane"]
command = ["node", "src/main.mjs"]
