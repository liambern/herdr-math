id = "herdr-math"
name = "herdr-math"
version = "0.2.0"
min_herdr_version = "0.8.2"
description = "Typeset display equations in the active terminal pane"
platforms = ["linux", "macos"]

[[build]]
command = ["npm", "ci"]

[[actions]]
id = "toggle"
title = "Toggle equation rendering (follows active pane)"
contexts = ["pane"]
command = ["node", "src/main.mjs"]
